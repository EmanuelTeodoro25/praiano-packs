<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Pacotes</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="pacotes">

    <div class="topo">

        <h1>PACOTES DE VIAGEM</h1>

        <button onclick="logout()">
            SAIR
        </button>

    </div>

    <div class="cards">

        <div class="card" onclick="abrirPacote1()">

            <div class="icone">🌎</div>

            <h2>Fora do País</h2>

            <p>Pacotes internacionais completos.</p>

        </div>

        <div class="card" onclick="abrirPacote2()">

            <div class="icone">✈️</div>

            <h2>Estados Brasileiros</h2>

            <p>Destinos incríveis pelo Brasil.</p>

        </div>

        <div class="card" onclick="abrirPacote3()">

            <div class="icone">🏖️</div>

            <h2>Seu Estado</h2>

            <p>Viagens econômicas perto de você.</p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
